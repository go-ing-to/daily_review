 list.addEventListener('keydown',e=>{const h=e.target.closest('.drag-handle');if(!h||drag||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const r=h.closest('.reorder-item'),other=e.key==='ArrowUp'?r.previousElementSibling:r.nextElementSibling;if(!other)return;if(e.key==='ArrowUp')list.insertBefore(r,other);else list.insertBefore(other,r);number();h.focus({preventScroll:true});r.scrollIntoView({block:'nearest'})});
 editor.addEventListener('close',()=>{end(true);editor.classList.remove('reorder-dialog')},{once:true});
 $('#cancelReorder').onclick=()=>{end(true);editor.close()};
 $('#finishReorder').onclick=()=>{
   end();const byId=new Map(db.items.map(i=>[i.id,i]));db.items=rows().map(r=>byId.get(r.dataset.reorderId));
   syncToday();
   save();editor.close();render();
 };
 editor.showModal();
}
function edit(id){let item=db.items.find(i=>i.id===id);editor.innerHTML=`<form method="dialog"><h2>${item?'항목 수정':'항목 추가'}</h2><textarea id="title" required rows="4">${esc(item?.title||'')}</textarea><h3>반복 요일</h3><div class="days">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" value="${d}" ${(!item?.weekdays||item.weekdays.includes(d))?'checked':''}>${'일월화수목금토'[d]}</label>`).join('')}</div><div class="row"><button value="cancel" formnovalidate>취소</button><button type="button" id="saveItem" class="primary">저장</button></div></form>`;editor.showModal();$('#saveItem').onclick=()=>{let title=$('#title').value.trim(),weekdays=[...editor.querySelectorAll('input:checked')].map(x=>+x.value);if(!title||!weekdays.length){alert('문항과 반복 요일을 선택하세요.');return}let data={title,weekdays:weekdays.length===7?null:weekdays};if(item)Object.assign(item,data);else db.items.push({id:uid(),...data});syncToday();save();editor.close();render()}}function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportRows(){let rows=[['날짜','구분','내용','상태','비고']];Object.values(db.days).sort((a,b)=>a.id.localeCompare(b.id)).forEach(d=>{d.entries.forEach(e=>rows.push([d.id,'체크',e.title,labels[e.status],e.note]));(d.inactiveEntries||[]).forEach(e=>rows.push([d.id,'목록 제외 기록',e.title,labels[e.status],e.note]));if(d.gratitude)rows.push([d.id,'감사일기',d.gratitude,'',''])});db.prayers.forEach(p=>rows.push([p.created,'기도 제목',p.title,p.answeredAt?'응답 '+p.answeredAt:'기도 중',p.answer]));return rows}function csv(){return '\uFEFF'+exportRows().map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+\-@\t\r\n]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n')}function valid(x){return x&&Array.isArray(x.items)&&x.items.every(i=>typeof i.id==='string'&&typeof i.title==='string'&&(!i.weekdays||Array.isArray(i.weekdays)&&i.weekdays.every(d=>Number.isInteger(d)&&d>=0&&d<=6)))&&x.days&&typeof x.days==='object'&&Object.entries(x.days).every(([k,d])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&d.id===k&&Array.isArray(d.entries)&&(d.inactiveEntries===undefined||Array.isArray(d.inactiveEntries))&&[...d.entries,...(d.inactiveEntries||[])].every(e=>e&&typeof e.id==='string'&&typeof e.title==='string'&&Object.hasOwn(labels,e.status)&&typeof e.note==='string'))&&Array.isArray(x.prayers)&&x.prayers.every(p=>typeof p.id==='string'&&typeof p.title==='string'&&typeof p.answer==='string'&&typeof p.created==='string')&&/^\d\d:\d\d$/.test(x.reminder)}
const PIN_KEY='dailyreview-pin-v1';let pinConfig=null,locked=false,hiddenAt=0,failures=0,blockedUntil=0;
try{const raw=localStorage.getItem(PIN_KEY);if(raw)pinConfig=JSON.parse(raw)}catch{pinConfig=null}
const pinBytes=hex=>new Uint8Array(hex.match(/.{2}/g).map(x=>parseInt(x,16)));const toHex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return toHex(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:pinBytes(salt),iterations:210000},k,256)))}
async function checkPin(pin){return !!pinConfig&&(await pinHash(pin,pinConfig.salt))===pinConfig.hash}
function securityView(){const field=(id,label)=>`<label>${label}<input id="${id}" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="off" required></label>`;return `<section><h2>비밀번호 잠금</h2><small>${pinConfig?'사용 중 · 앱을 새로 열거나 30초 이상 다른 화면에 있다가 돌아오면 잠깁니다.':'4~12자리 숫자 비밀번호를 설정할 수 있습니다.'}</small><form id="pinForm" class="security-form">${pinConfig?field('oldPin','현재 비밀번호'):''}${field('newPin','새 비밀번호 (숫자 4~12자리)')}${field('repeatPin','새 비밀번호 확인')}<button type="submit" class="primary">${pinConfig?'비밀번호 변경':'비밀번호 설정'}</button><p id="pinMessage" class="lock-error" role="status"></p></form>${pinConfig?`<button data-act="lockNow">지금 잠그기</button><hr><form id="disablePinForm" class="security-form">${field('disablePin','현재 비밀번호')}<button class="danger" type="submit">비밀번호 잠금 해제</button><p id="disableMessage" class="lock-error" role="status"></p></form>`:''}<small>앱 화면을 잠그는 기능이며, 저장 기록 자체를 암호화하지는 않습니다. 비밀번호를 잊으면 앱 내에서 복구할 수 없으니 별도로 안전하게 보관하세요.</small></section>`}
function lockApp(){if(!pinConfig||locked)return;locked=true;if(editor.open)editor.close();document.activeElement?.blur();main.replaceChildren();document.body.classList.add('locked');$('#lockScreen').hidden=false;$('#unlockPin').value='';$('#unlockError').textContent='';}
function unlockApp(){locked=false;failures=0;blockedUntil=0;$('#unlockPin').value='';$('#unlockError').textContent='';$('#lockScreen').hidden=true;document.body.classList.remove('locked');render()}
function initSecurity(){if(pinConfig)lockApp();else render();document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else{if(hiddenAt&&Date.now()-hiddenAt>=30000)lockApp();hiddenAt=0}});window.addEventListener('pageshow',e=>{if(e.persisted)lockApp()});}
document.addEventListener('submit',async e=>{const f=e.target;if(!['pinForm','disablePinForm','unlockForm'].includes(f.id))return;e.preventDefault();const button=f.querySelector('button[type=submit]');if(button.disabled)return;button.disabled=true;let msg=f.id==='unlockForm'?$('#unlockError'):f.id==='pinForm'?$('#pinMessage'):$('#disableMessage');msg.textContent='';try{if(!crypto.subtle)throw Error('보안 연결(HTTPS)이 필요합니다.');if(f.id==='unlockForm'){if(Date.now()<blockedUntil)throw Error('잠시 후 다시 시도하세요.');if(!await checkPin($('#unlockPin').value)){failures++;$('#unlockPin').value='';if(failures>=5){blockedUntil=Date.now()+30000;failures=0;throw Error('5회 틀렸습니다. 30초 후 다시 시도하세요.')}throw Error('비밀번호가 일치하지 않습니다.')}unlockApp();return}if(f.id==='disablePinForm'){if(!await checkPin($('#disablePin').value))throw Error('현재 비밀번호가 일치하지 않습니다.');localStorage.removeItem(PIN_KEY);pinConfig=null;render();return}if(pinConfig&&!await checkPin($('#oldPin').value))throw Error('현재 비밀번호가 일치하지 않습니다.');const pin=$('#newPin').value;if(!/^\d{4,12}$/.test(pin))throw Error('4~12자리 숫자를 입력하세요.');if(pin!==$('#repeatPin').value)throw Error('새 비밀번호가 일치하지 않습니다.');const salt=toHex(crypto.getRandomValues(new Uint8Array(16))),hash=await pinHash(pin,salt);const cfg={salt,hash};localStorage.setItem(PIN_KEY,JSON.stringify(cfg));pinConfig=cfg;render();$('#pinMessage').textContent='비밀번호가 저장되었습니다.'}catch(err){msg.textContent=err.message||'비밀번호 처리 실패'}finally{button.disabled=false}});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.note)update(date,t.dataset.note,'note',t.value);if(t.id==='gratitude'){let d=day(date);d.gratitude=t.value;db.days[date]=d;save()}if(t.dataset.prayer){let p=db.prayers.find(x=>x.id===t.dataset.prayer);if(p){p[t.dataset.field]=t.value;save()}}if(t.id==='reminder'){db.reminder=t.value;save()}});document.addEventListener('change',async e=>{let t=e.target;if(t.id==='date'){date=t.value||date;render()}if(t.dataset.status){update(date,t.dataset.status,'status',t.value);render()}if(t.id==='restore'&&t.files.length){try{let x=JSON.parse(await t.files[0].text());if(!valid(x))throw Error('invalid');if(confirm('현재 기록을 백업 파일로 교체할까요?')){db=x;save();render()}}catch{alert('올바른 웹 앱 백업 파일이 아닙니다.')}}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){if(locked)return;tab=b.dataset.tab;if(tab==='settings')settingsPage='home';render();window.scrollTo(0,0);return}let a=b.dataset.act,id=b.dataset.id;if(!a)return;let i=db.items.findIndex(x=>x.id===id);switch(a){case'settingsPage':settingsPage=id;render();window.scrollTo(0,0);return;case'lockNow':lockApp();return;case'prev':date=shift(date,-1);break;case'next':date=shift(date,1);break;case'today':date=key(new Date());break;case'toggle':{let x=day(date).entries.find(x=>x.id===id);update(date,id,'status',x.status==='done'?'unmarked':'done');break}case'period':period=id;break;case'backperiod':case'forwardperiod':{let n=a==='backperiod'?-1:1;let d=dt(bounds()[0]);if(period==='week')d.setDate(d.getDate()+7*n);else if(period==='month')d.setMonth(d.getMonth()+n);else d.setFullYear(d.getFullYear()+n);anchor=key(d);break}case'openday':date=id;tab='daily';break;case'openmonth':anchor=id;period='month';break;case'prayers':tab='prayers';break;case'daily':tab='daily';break;case'addPrayer':{let title=$('#newPrayer').value.trim();if(title){db.prayers.push({id:uid(),title,created:key(new Date()),answer:'',answeredAt:''});save()}break}case'deletePrayer':if(confirm('기도 기록을 삭제할까요?')){db.prayers=db.prayers.filter(p=>p.id!==id);save()}break;case'reorder':reorderItems();return;case'edit':case'add':edit(id);return;case'delete':if(confirm('삭제할까요? 기존 날짜의 기록은 유지됩니다.')){db.items.splice(i,1);syncToday();save()}break;case'backup':download('하루돌아보기-백업.json',JSON.stringify(db,null,2),'application/json');return;case'restore':$('#restore').click();return;case'csv':download('하루돌아보기.csv',csv(),'text/csv;charset=utf-8');return;case'print':{let print=document.createElement('div');print.className='print-only';print.innerHTML='<h1>하루 돌아보기 기록</h1>'+exportRows().slice(1).map(r=>'<section>'+r.map(esc).join(' · ')+'</section>').join('');main.append(print);document.body.classList.add('printing');window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');print.remove()},{once:true});window.print();return}case'ics':{let today=key(new Date()).replaceAll('-',''),time=db.reminder.replace(':','')+'00';download('하루돌아보기.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DailyReview//KO','BEGIN:VEVENT','UID:'+uid()+'@dailyreview','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART:'+today+'T'+time,'DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:하루 돌아보기','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:하루 점검 시간','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),'text/calendar');return}default:return}render()});initSecurity();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
