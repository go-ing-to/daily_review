'use strict';const $=s=>document.querySelector(s), main=$('#main'), editor=$('#editor'), labels={unmarked:'미기록',done:'실천',notDone:'미실천',excluded:'해당 없음'}, symbols={unmarked:'☐',done:'☑',notDone:'☒',excluded:'⊟'};const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const fresh=()=>({version:2,items:titles.map(title=>({id:uid(),title,weekdays:null})),days:{},prayers:[],reminder:'22:00'});let db;try{db=JSON.parse(localStorage.getItem('dailyreview-v2'))||fresh()}catch(e){db=fresh();alert('저장 기록을 읽지 못했습니다. 기존 백업을 확인하세요.')}let tab='daily', date=key(new Date()), anchor=date, period='week';function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dt(k){return new Date(k+'T12:00:00')}function shift(k,n){let d=dt(k);d.setDate(d.getDate()+n);return key(d)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem('dailyreview-v2',JSON.stringify(db))}catch(e){alert('저장 실패: 저장 공간을 확인하고 백업하세요.')}}function day(k){return db.days[k]||{id:k,entries:db.items.filter(i=>!i.weekdays||i.weekdays.includes(dt(k).getDay())).map(i=>({id:i.id,title:i.title,status:'unmarked',note:''})),gratitude:''}}function update(k,id,field,v){let d=day(k),e=d.entries.find(i=>i.id===id);if(e)e[field]=v;db.days[k]=d;save()}function summary(entries){let n=entries.filter(e=>e.status!=='excluded').length,done=entries.filter(e=>e.status==='done').length;return {n,done,p:n?Math.round(100*done/n):0,label:n?Math.round(100*done/n)+'%':'—'}}function bar(s){return `<div class="bar"><i style="width:${s.p}%"></i></div>`}function score(s){return `<div class="row"><span class="score">${s.label}</span><small>${s.done} / ${s.n}개 실천</small></div>${bar(s)}`}function daily(){let d=day(date),s=summary(d.entries);return `<div class="row"><button data-act="prev">‹</button><input type="date" id="date" value="${date}" max="${key(new Date())}"><button data-act="next" ${date>=key(new Date())?'disabled':''}>›</button><button data-act="today">오늘</button></div><section><small>하루 실천 현황</small><div id="score">${score(s)}</div><small>체크하거나 상태를 선택하세요. 해당 없음은 통계에서 제외합니다.</small></section><button data-act="prayers" class="primary">기도 제목 및 응답 기록</button>${d.entries.map((e,i)=>`<section><div class="row"><div class="grow">${i+1}. ${esc(e.title)}</div><button class="check" aria-label="${esc(labels[e.status])}" data-act="toggle" data-id="${esc(e.id)}">${symbols[e.status]}</button></div><select data-status="${esc(e.id)}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${v===e.status?'selected':''}>${l}</option>`).join('')}</select><textarea rows="2" placeholder="비고 · 특이사항" data-note="${esc(e.id)}">${esc(e.note)}</textarea></section>`).join('')}<section><h2>하루 감사일기</h2><textarea id="gratitude" rows="5" placeholder="오늘 감사한 일">${esc(d.gratitude)}</textarea></section>`}function bounds(){let d=dt(anchor),start,end;if(period==='week'){d.setDate(d.getDate()-(d.getDay()+6)%7);start=key(d);end=shift(start,6)}else if(period==='month'){start=key(new Date(d.getFullYear(),d.getMonth(),1));end=key(new Date(d.getFullYear(),d.getMonth()+1,0))}else{start=key(new Date(d.getFullYear(),0,1));end=key(new Date(d.getFullYear(),11,31))}return [start,end]}function records(a,b){return Object.values(db.days).filter(d=>d.id>=a&&d.id<=b).sort((x,y)=>x.id.localeCompare(y.id))}function periodView(){let [a,b]=bounds(),r=records(a,b),entries=r.flatMap(d=>d.entries),groups={};entries.forEach(e=>(groups[e.id]??=[]).push(e));let rows=[];if(period==='year'){for(let m=0;m<12;m++){let d=dt(a);d.setMonth(m);let k=key(d),end=key(new Date(d.getFullYear(),m+1,0));let rr=records(k,end);rows.push([`${m+1}월`,k,rr, 'month'])}}else{for(let k=a;k<=b;k=shift(k,1))rows.push([k,k,db.days[k]?[db.days[k]]:[],'day'])}return `<div class="seg">${[['week','주간'],['month','월간'],['year','연간']].map(([v,l])=>`<button class="${period===v?'sel':''}" data-act="period" data-id="${v}">${l}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button data-act="backperiod">‹</button><small>${a} ~ ${b}</small><button data-act="forwardperiod" ${b>=key(new Date())?'disabled':''}>›</button></div><section><small>기간 실천율 · 기록 ${r.length}일</small>${score(summary(entries))}<small>저장된 날짜만 집계하며 미기록 항목은 분모에 포함합니다.</small></section><section><h2>${period==='year'?'월별':'날짜별'} 점검</h2>${rows.map(([l,k,rr,t])=>`<div class="stat row"><button data-act="open${t}" data-id="${k}" ${k>key(new Date())?'disabled':''}>${l}</button><div class="grow">${rr.length?bar(summary(rr.flatMap(d=>d.entries))):''}</div><small>${rr.length?summary(rr.flatMap(d=>d.entries)).label:k>key(new Date())?'예정':'기록 없음'}</small></div>`).join('')}</section><section><h2>항목별 점검</h2>${Object.values(groups).map(g=>`<div class="stat">${esc(g.at(-1).title)}<div class="row"><div class="grow">${bar(summary(g))}</div>${summary(g).label}</div></div>`).join('')||'<small>기록 없음</small>'}</section>`}function settings(){return `<section><h2>점검 알림</h2><small>웹 앱은 자체 예약 알림 대신 아이폰 미리 알림 앱에서 매일 반복 알림을 설정하세요.</small><label>희망 시간 <input type="time" id="reminder" value="${esc(db.reminder)}"></label><button data-act="ics">반복 일정 파일 만들기</button><p><small>캘린더에서 일정과 알림을 확인하세요. 파일 가져오기가 안 되면 미리 알림에서 직접 등록해 주세요.</small></p></section><section><h2>기록 관리</h2><div class="row"><button data-act="backup">백업 JSON</button><button data-act="restore">백업 복원</button></div><p class="row"><button data-act="csv">엑셀용 CSV</button><button data-act="print">PDF / 인쇄</button></p><input type="file" accept=".json,application/json" id="restore" hidden><small>기록은 기기 내 저장됩니다. 앱 삭제·웹사이트 데이터 삭제 시 사라질 수 있습니다. 백업에는 개인 기록이 평문으로 포함됩니다. 정기적으로 파일 앱에 보관하세요.</small></section><section><h2>개인정보 보호</h2><small>이 웹 버전에는 자체 Face ID 인증이 없습니다. 홈 화면 앱 아이콘을 길게 눌러 기기에서 잠금 기능이 제공되는지 확인하세요. 네이티브 버전은 Face ID / 기기 암호 잠금을 지원합니다.</small></section><section><h2>체크항목 관리 (${db.items.length}개)</h2><div class="manage-actions"><button data-act="add">＋ 추가</button><button data-act="reorder" ${db.items.length<2?'disabled':''}>☰ 순서 변경</button></div><p><small>문항 내용 수정은 아직 저장하지 않은 날에만 반영됩니다. 순서 변경은 오늘과 이후에 반영됩니다.</small></p>${db.items.map((i,n)=>`<div class="stat manage-item"><p>${n+1}. ${esc(i.title)}</p><small>${i.weekdays?i.weekdays.map(d=>'일월화수목금토'[d]).join(' · '):'매일'}</small><div class="row"><button data-act="edit" data-id="${esc(i.id)}">수정</button><button class="danger" data-act="delete" data-id="${esc(i.id)}">삭제</button></div></div>`).join('')}</section>`}function prayers(){return `<button data-act="daily">‹ 체크항목</button><section><h2>기도 제목</h2><textarea id="newPrayer" placeholder="새 기도 제목"></textarea><button data-act="addPrayer">추가</button></section>${db.prayers.map(p=>`<section><textarea data-prayer="${esc(p.id)}" data-field="title" rows="2">${esc(p.title)}</textarea><small>등록 ${esc(p.created)}</small><label>응답일 <input type="date" data-prayer="${esc(p.id)}" data-field="answeredAt" value="${esc(p.answeredAt||'')}" max="${key(new Date())}"></label><textarea data-prayer="${esc(p.id)}" data-field="answer" placeholder="응답 내용">${esc(p.answer)}</textarea><button class="danger" data-act="deletePrayer" data-id="${esc(p.id)}">삭제</button></section>`).join('')}`}function render(){main.innerHTML=tab==='daily'?daily():tab==='period'?periodView():tab==='settings'?settings():prayers();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===(tab==='prayers'?'daily':tab)))}function reorderItems(){
 editor.classList.add('reorder-dialog');
 const grip='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"/></svg>';
 editor.innerHTML=`<div class="reorder-head"><h2>순서 변경</h2><button type="button" id="finishReorder" class="primary">완료</button></div><small class="reorder-help">오른쪽 손잡이를 잡고 위아래로 이동하세요.</small><div class="reorder-list" id="reorderList">${db.items.map((i,n)=>`<div class="reorder-item" data-reorder-id="${esc(i.id)}"><div class="grow"><span class="reorder-number">${n+1}.</span> ${esc(i.title)}</div><button type="button" class="drag-handle" aria-label="${esc(i.title)} 순서 변경. 위아래 방향키로도 이동 가능">${grip}</button></div>`).join('')}</div><div class="reorder-foot"><button type="button" id="cancelReorder">취소</button><small>${db.items.length}개 항목</small></div>`;
 const list=$('#reorderList'); let drag=null, raf=0;
 const rows=()=>Array.from(list.children);
 const number=()=>rows().forEach((r,i)=>r.querySelector('.reorder-number').textContent=(i+1)+'.');
 function moveAt(y){
   if(!drag)return;

   else if(y>current.bottom&&index<all.length-1){const target=all.slice(index+1).filter(r=>{const b=r.getBoundingClientRect();return y>b.top+b.height/2}).at(-1);if(target)list.insertBefore(drag.row,target.nextElementSibling)}
   number();
 }
 function frame(){

   const b=list.getBoundingClientRect(), edge=Math.min(56,b.height/4), y=drag.y;
   let speed=0;
   if(y<b.top+edge)speed=-Math.min(18,Math.max(0,(b.top+edge-y)/3));

   try{if(list.hasPointerCapture(d.pointer))list.releasePointerCapture(d.pointer)}catch{}

 list.addEventListener('pointerdown',e=>{

   e.preventDefault();ghost.classList.add('drag-ghost');ghost.setAttribute('aria-hidden','true');ghost.querySelector('button').tabIndex=-1;

}
function edit(id){let item=db.items.find(i=>i.id===id);editor.innerHTML=`<form method="dialog"><h2>${item?'항목 수정':'항목 추가'}</h2><textarea id="title" required rows="4">${esc(item?.title||'')}</textarea><h3>반복 요일</h3><div class="days">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" value="${d}" ${(!item?.weekdays||item.weekdays.includes(d))?'checked':''}>${'일월화수목금토'[d]}</label>`).join('')}</div><div class="row"><button value="cancel" formnovalidate>취소</button><button type="button" id="saveItem" class="primary">저장</button></div></form>`;editor.showModal();$('#saveItem').onclick=()=>{let title=$('#title').value.trim(),weekdays=[...editor.querySelectorAll('input:checked')].map(x=>+x.value);if(!title||!weekdays.length){alert('문항과 반복 요일을 선택하세요.');return}let data={title,weekdays:weekdays.length===7?null:weekdays};if(item)Object.assign(item,data);else db.items.push({id:uid(),...data});save();editor.close();render()}}function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportRows(){let rows=[['날짜','구분','내용','상태','비고']];Object.values(db.days).sort((a,b)=>a.id.localeCompare(b.id)).forEach(d=>{d.entries.forEach(e=>rows.push([d.id,'체크',e.title,labels[e.status],e.note]));if(d.gratitude)rows.push([d.id,'감사일기',d.gratitude,'',''])});db.prayers.forEach(p=>rows.push([p.created,'기도 제목',p.title,p.answeredAt?'응답 '+p.answeredAt:'기도 중',p.answer]));return rows}function csv(){return '\uFEFF'+exportRows().map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+\-@\t\r\n]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n')}function valid(x){return x&&Array.isArray(x.items)&&x.items.every(i=>typeof i.id==='string'&&typeof i.title==='string'&&(!i.weekdays||Array.isArray(i.weekdays)&&i.weekdays.every(d=>Number.isInteger(d)&&d>=0&&d<=6)))&&x.days&&typeof x.days==='object'&&Object.entries(x.days).every(([k,d])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&d.id===k&&Array.isArray(d.entries)&&d.entries.every(e=>typeof e.id==='string'&&typeof e.title==='string'&&Object.hasOwn(labels,e.status)&&typeof e.note==='string'))&&Array.isArray(x.prayers)&&x.prayers.every(p=>typeof p.id==='string'&&typeof p.title==='string'&&typeof p.answer==='string'&&typeof p.created==='string')&&/^\d\d:\d\d$/.test(x.reminder)}
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.note)update(date,t.dataset.note,'note',t.value);if(t.id==='gratitude'){let d=day(date);d.gratitude=t.value;db.days[date]=d;save()}if(t.dataset.prayer){let p=db.prayers.find(x=>x.id===t.dataset.prayer);if(p){p[t.dataset.field]=t.value;save()}}if(t.id==='reminder'){db.reminder=t.value;save()}});document.addEventListener('change',async e=>{let t=e.target;if(t.id==='date'){date=t.value||date;render()}if(t.dataset.status){update(date,t.dataset.status,'status',t.value);render()}if(t.id==='restore'&&t.files.length){try{let x=JSON.parse(await t.files[0].text());if(!valid(x))throw Error('invalid');if(confirm('현재 기록을 백업 파일로 교체할까요?')){db=x;save();render()}}catch{alert('올바른 웹 앱 백업 파일이 아닙니다.')}}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}let a=b.dataset.act,id=b.dataset.id;if(!a)return;let i=db.items.findIndex(x=>x.id===id);switch(a){case'prev':date=shift(date,-1);break;case'next':date=shift(date,1);break;case'today':date=key(new Date());break;case'toggle':{let x=day(date).entries.find(x=>x.id===id);update(date,id,'status',x.status==='done'?'unmarked':'done');break}case'period':period=id;break;case'backperiod':case'forwardperiod':{let n=a==='backperiod'?-1:1;let d=dt(bounds()[0]);if(period==='week')d.setDate(d.getDate()+7*n);else if(period==='month')d.setMonth(d.getMonth()+n);else d.setFullYear(d.getFullYear()+n);anchor=key(d);break}case'openday':date=id;tab='daily';break;case'openmonth':anchor=id;period='month';break;case'prayers':tab='prayers';break;case'daily':tab='daily';break;case'addPrayer':{let title=$('#newPrayer').value.trim();if(title){db.prayers.push({id:uid(),title,created:key(new Date()),answer:'',answeredAt:''});save()}break}case'deletePrayer':if(confirm('기도 기록을 삭제할까요?')){db.prayers=db.prayers.filter(p=>p.id!==id);save()}break;case'reorder':reorderItems();return;case'edit':case'add':edit(id);return;case'delete':if(confirm('삭제할까요? 기존 날짜의 기록은 유지됩니다.')){db.items.splice(i,1);save()}break;case'backup':download('하루돌아보기-백업.json',JSON.stringify(db,null,2),'application/json');return;case'restore':$('#restore').click();return;case'csv':download('하루돌아보기.csv',csv(),'text/csv;charset=utf-8');return;case'print':{let print=document.createElement('div');print.className='print-only';print.innerHTML='<h1>하루 돌아보기 기록</h1>'+exportRows().slice(1).map(r=>'<section>'+r.map(esc).join(' · ')+'</section>').join('');main.append(print);document.body.classList.add('printing');window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');print.remove()},{once:true});window.print();return}case'ics':{let today=key(new Date()).replaceAll('-',''),time=db.reminder.replace(':','')+'00';download('하루돌아보기.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DailyReview//KO','BEGIN:VEVENT','UID:'+uid()+'@dailyreview','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART:'+today+'T'+time,'DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:하루 돌아보기','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:하루 점검 시간','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),'text/calendar');return}default:return}render()});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
